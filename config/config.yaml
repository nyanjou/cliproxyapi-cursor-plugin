# Configuration template for the experimental Cursor Agent CLI provider.
# Render __CLIPROXYAPI_API_KEY__ into a private runtime copy before use.
host: "0.0.0.0"
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

# Publish the container only on host loopback in docker-compose.yml.
remote-management:
  allow-remote: true
  secret-key: ""
  disable-control-panel: false

auth-dir: "/root/.cli-proxy-api"

api-keys:
  - "__CLIPROXYAPI_API_KEY__"

debug: false
logging-to-file: false
logs-max-total-size-mb: 100
usage-statistics-enabled: false
passthrough-headers: true
request-retry: 1
max-retry-credentials: 1

plugins:
  enabled: true
  dir: "plugins"
  configs:
    cliproxyapi-cursor:
      enabled: true
      priority: 100
      executable_path: "agent"
      managed_install_root: "/cursor-home"
      max_package_bytes: 268435456
      max_expanded_bytes: 536870912
      max_archive_entries: 10000
      # Parent only; each request gets a fresh 0700 child workspace that is cleaned up.
      workspace: "/var/lib/cliproxyapi-cursor/workspaces"
      model_prefix: "cursor/"
      allowed_models: []
      denied_models: []
      excluded_model_prefixes: []
      environment_allowlist:
        - "HOME"
        - "PATH"
        - "SHELL"
        - "USER"
        - "LOGNAME"
        - "TMPDIR"
        - "NO_COLOR"
        - "TERM"
      timeout_seconds: 120
      model_cache_ttl_seconds: 600
      max_prompt_bytes: 524288
      max_request_bytes: 1048576
      max_stdout_bytes: 2097152
      max_stderr_bytes: 65536
      max_concurrent: 1
