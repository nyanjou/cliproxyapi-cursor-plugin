name: cliproxyapi-cursor-dev

services:
  cliproxyapi:
    # Example only: this image supplies CLIProxyAPI. Install the official Cursor Agent CLI
    # later through the plugin's explicit-confirmation setup page, or preinstall it manually.
    image: eceasy/cli-proxy-api:7.2.138
    pull_policy: missing
    container_name: cliproxyapi-cursor-dev
    restart: unless-stopped
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:?generate .runtime/secrets.env first}
      TZ: UTC
      HOME: /cursor-home
    ports:
      - "127.0.0.1:8317:8317"
    volumes:
      - ./.runtime/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./build/plugins:/CLIProxyAPI/plugins:ro
      - ./logs:/CLIProxyAPI/logs
      - cursor-agent-home:/cursor-home
      - cursor-agent-workspace:/var/lib/cliproxyapi-cursor/workspaces
      - cliproxyapi-home:/root/.cli-proxy-api
    security_opt:
      - no-new-privileges:true

volumes:
  cliproxyapi-home:
    name: cliproxyapi_cursor_dev_home
  cursor-agent-home:
    name: cliproxyapi_cursor_agent_home
  cursor-agent-workspace:
    name: cliproxyapi_cursor_workspace
