name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Verify tag exists remotely
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"

      - name: Run tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/src/.cache/home \
            -e GOCACHE=/src/.cache/go-build \
            -e GOMODCACHE=/src/.cache/go-mod \
            -v "$PWD:/src" \
            -w /src \
            golang:1.26-bookworm \
            go test ./...

      - name: Build marketplace package
        run: make package VERSION=${{ steps.version.outputs.value }}

      - name: Publish or replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/cliproxyapi-cursor_${VERSION}_linux_amd64.zip" \
              dist/checksums.txt \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "dist/cliproxyapi-cursor_${VERSION}_linux_amd64.zip" \
              dist/checksums.txt \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
